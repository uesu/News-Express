name: X RSS fleet probe (manual, read-only)

# Round 111 (2026-11-06): a manual, read-only probe of X RSS instances FROM THE
# GITHUB ACTIONS RUNNERS — the only vantage point the fleet ranking trusts
# (AGENTS.md §9: a clean body read off-runner is a trial ticket, never proof).
# It fetches `/<account>/rss` on every listed instance, and reports HTTP code,
# latency, entry count, newest entry id/date, the "Generated by" host inside the
# feed, and top-id parity against the first instance — as a job-summary table.
#
# Dev-only: not in sync_prod.py's SYNC_WORKFLOW_FILES, so it never reaches the
# production repos. No secrets, no webhooks, no cache writes, no posting. It is
# never scheduled — dispatch it by hand when reviewing a rotation. It also
# self-runs on a pull request that edits this file (the defaults below), so a
# rotation PR carries fresh runner evidence without a manual dispatch.

on:
  pull_request:
    paths:
      - '.github/workflows/fleet_probe.yml'
  workflow_dispatch:
    inputs:
      instances:
        description: 'Comma-separated instance origins to probe (default: the teapawt family + the round-111 spares)'
        required: false
        default: 'https://nitter.cf,https://xitter.cf,https://nitter.gq,https://xitter.gq,https://teapaw.org,https://teapawt.net,https://teapawt.org,https://nitter.mizuki.st,https://nitter.meowing.monster'
      accounts:
        description: 'Comma-separated X handles (default: the News-Express + Game-Express union)'
        required: false
        default: 'TYPEII_EN,PomPom_HonkaiSR,Wuthering_Waves,HonkaiNA,Ananta_EN,GenshinImpact,honkaistarrail,ZZZ_EN'

permissions:
  contents: read
  # Only used to leave the probe table as a comment on the pull request that
  # triggered it (job summaries are not readable through the API).
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # On pull_request `inputs` is empty, so the defaults are repeated here.
      PROBE_INSTANCES: ${{ inputs.instances || 'https://nitter.cf,https://xitter.cf,https://nitter.gq,https://xitter.gq,https://teapaw.org,https://teapawt.net,https://teapawt.org,https://nitter.mizuki.st,https://nitter.meowing.monster' }}
      PROBE_ACCOUNTS: ${{ inputs.accounts || 'TYPEII_EN,PomPom_HonkaiSR,Wuthering_Waves,HonkaiNA,Ananta_EN,GenshinImpact,honkaistarrail,ZZZ_EN' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Probe every instance x account (stdlib only; nothing is written)
        run: |
          python3 - <<'PY'
          import os, re, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          insts = [i.strip().rstrip("/") for i in os.environ["PROBE_INSTANCES"].split(",") if i.strip()]
          accts = [a.strip() for a in os.environ["PROBE_ACCOUNTS"].split(",") if a.strip()]
          ID_RE = re.compile(r"/status(?:es)?/(\d{8,25})")
          def probe(inst, acct):
              url = f"{inst}/{acct}/rss"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              t0 = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = r.read(); code = r.status
              except urllib.error.HTTPError as e:
                  return {"code": e.code, "ms": int((time.monotonic() - t0) * 1000), "n": 0, "top": "", "date": "", "gen": "", "note": "HTTP error"}
              except Exception as e:
                  return {"code": 0, "ms": int((time.monotonic() - t0) * 1000), "n": 0, "top": "", "date": "", "gen": "", "note": type(e).__name__}
              ms = int((time.monotonic() - t0) * 1000)
              try:
                  root = ET.fromstring(body)
              except ET.ParseError:
                  return {"code": code, "ms": ms, "n": 0, "top": "", "date": "", "gen": "", "note": "not XML (wall/challenge?)"}
              items = root.findall("./channel/item")
              desc = (root.findtext("./channel/description") or "")
              m = re.search(r"Generated by\s+(\S+)", desc)
              gen = m.group(1).rstrip("/") if m else ""
              top, date = "", ""
              for it in items:  # skip pinned: the newest own tweet by id
                  link = it.findtext("link") or ""
                  mm = ID_RE.search(link)
                  if mm and (not top or int(mm.group(1)) > int(top)):
                      top = mm.group(1)
                      try:
                          date = parsedate_to_datetime(it.findtext("pubDate") or "").strftime("%Y-%m-%d %H:%M")
                      except Exception:
                          date = (it.findtext("pubDate") or "")[:25]
              return {"code": code, "ms": ms, "n": len(items), "top": top, "date": date, "gen": gen, "note": "" if items else "0 entries"}
          rows = []
          for acct in accts:
              ref = None
              for inst in insts:
                  r = probe(inst, acct); r.update(inst=inst, acct=acct)
                  if ref is None and r["top"]:
                      ref = r["top"]
                  r["parity"] = "ref" if r["top"] and r["top"] == ref and inst == insts[0] else ("same" if r["top"] and r["top"] == ref else ("DIFF" if r["top"] else "-"))
                  rows.append(r)
                  print(f"[{acct}] {inst} -> {r['code']} {r['ms']}ms entries={r['n']} top={r['top']} {r['date']} gen={r['gen']} {r['note']} parity={r['parity']}")
                  time.sleep(0.3)
          out = ["## X RSS fleet probe (from the GitHub Actions runners)", "",
                 f"Instances: {len(insts)} · Accounts: {len(accts)} · {time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime())}", "",
                 "| account | instance | HTTP | ms | entries | newest id | newest (UTC) | generated by | parity | note |",
                 "|---|---|---:|---:|---:|---|---|---|---|---|"]
          for r in rows:
              out.append(f"| {r['acct']} | {r['inst']} | {r['code']} | {r['ms']} | {r['n']} | {r['top']} | {r['date']} | {r['gen']} | {r['parity']} | {r['note']} |")
          ok = {}
          for r in rows:
              ok.setdefault(r["inst"], [0, 0]); ok[r["inst"]][1] += 1
              if r["code"] == 200 and r["n"]: ok[r["inst"]][0] += 1
          out += ["", "### Per-instance", "", "| instance | served | of |", "|---|---:|---:|"]
          out += [f"| {i} | {a} | {b} |" for i, (a, b) in ok.items()]
          text = "\n".join(out)
          print("\n" + text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text + "\n")
          with open("/tmp/fleet_probe.md", "w", encoding="utf-8") as fh:
              fh.write(text + "\n")
          PY

      - name: Leave the table on the pull request (pull_request runs only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@/tmp/fleet_probe.md >/dev/null
