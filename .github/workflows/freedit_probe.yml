name: Reddit mirror probe (Eddrit + Freedit, no posting)

# Diagnostic only: no cron, monitor code, production caches or secrets.
# Branch-only push bootstrap avoids merging a new workflow into main just to
# run the user-requested live test. No production/default-branch push trigger.
on:
  workflow_dispatch:
  push:
    branches: [arena/c45edf9b-news-express]
    paths:
      - .github/workflows/freedit_probe.yml
      - .github/scripts/probe_freedit.py
      - tests/test_freedit_probe.py

permissions:
  contents: read

concurrency:
  group: freedit-endpoint-probe-${{ github.repository }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, same immutable pin as this repository
        with:
          persist-credentials: false

      # The Ubuntu runner supplies Python 3; this diagnostic is stdlib-only.
      - name: Offline diagnostic tests
        run: python3 tests/test_freedit_probe.py

      - name: Zenless Zone Zero — Eddrit HTML + RSS and Freedit subreddit root
        run: python3 .github/scripts/probe_freedit.py --suite zzz --annotations --output "$RUNNER_TEMP/mirror-zzz.json"

      - name: Genshin Impact — Eddrit HTML + RSS and Freedit subreddit root
        run: python3 .github/scripts/probe_freedit.py --suite genshin --annotations --output "$RUNNER_TEMP/mirror-genshin.json"

      - name: Honkai Star Rail — Eddrit HTML + RSS and Freedit subreddit root
        run: python3 .github/scripts/probe_freedit.py --suite hsr --annotations --output "$RUNNER_TEMP/mirror-hsr.json"

      - name: Wuthering Waves — Eddrit HTML + RSS and Freedit subreddit root
        run: python3 .github/scripts/probe_freedit.py --suite wuwa --annotations --output "$RUNNER_TEMP/mirror-wuwa.json"

      - name: Honkai Nexus Anima — Eddrit HTML + RSS and Freedit subreddit root
        run: python3 .github/scripts/probe_freedit.py --suite hna --annotations --output "$RUNNER_TEMP/mirror-hna.json"

      - name: Ananta — Eddrit HTML + RSS and Freedit subreddit root
        run: python3 .github/scripts/probe_freedit.py --suite ananta --annotations --output "$RUNNER_TEMP/mirror-ananta.json"
